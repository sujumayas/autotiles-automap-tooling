<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Automix maps</title>
<style>
  :root { --bg: #14121a; --panel: #1f1c27f0; --ink: #e9e4d8; --dim: #9a93a8; --line: #3a3446; --accent: #e8b84a; --field: #2a2634; --err: #f88; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  canvas.stage { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  #overlay { pointer-events: none; }
  #panel { position: absolute; top: 10px; left: 10px; bottom: 10px; width: 310px; display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; user-select: none; }
  #panel.hidden { bottom: auto; }
  #panel.hidden > :not(.head) { display: none; }
  .head { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px 6px; }
  .head b { color: var(--accent); }
  button { background: var(--field); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--dim); }
  button.primary { background: var(--accent); color: #1a1408; border-color: var(--accent); font-weight: bold; }
  button.link { background: none; border: 0; color: var(--dim); padding: 0 2px; }
  button:disabled { opacity: 0.5; cursor: wait; }
  .tabs { display: flex; gap: 4px; padding: 0 12px; border-bottom: 1px solid var(--line); }
  .tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; color: var(--dim); padding: 6px 5px; }
  .tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
  .body { flex: 1; overflow-y: auto; padding: 8px 12px 12px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 5px 0; color: var(--dim); }
  .row > span { flex: 1; }
  input, select { background: var(--field); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; font: inherit; }
  input[type=number], input[type=text], select { width: 118px; box-sizing: border-box; }
  input[type=range] { width: 118px; }
  .seed { display: flex; gap: 3px; width: 118px; }
  .seed input { width: 0; flex: 1; }
  .tags { display: flex; flex-wrap: wrap; gap: 3px; margin: 4px 0 6px; }
  .tags label { border: 1px solid var(--line); border-radius: 10px; padding: 1px 7px; cursor: pointer; color: var(--dim); }
  .tags label.on { border-color: var(--accent); color: var(--ink); }
  .tags input { display: none; }
  details { margin: 6px 0; } summary { color: var(--dim); cursor: pointer; }
  h4 { margin: 12px 0 4px; color: var(--accent); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .sites { margin-top: 4px; }
  .site { border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; margin: 4px 0; }
  .site .top { display: flex; justify-content: space-between; gap: 6px; }
  .site .name { color: var(--ink); }
  .site .kind { color: var(--dim); }
  .site .ops { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
  .site .ops select { width: auto; }
  .site .ops input[type=color] { width: 22px; height: 20px; padding: 0; border: 1px solid var(--line); background: none; }
  .site .ops label { display: flex; align-items: center; gap: 2px; color: var(--dim); }
  .help { color: var(--dim); font-size: 11px; border-top: 1px solid var(--line); padding-top: 8px; margin-top: 12px; }
  .help kbd { color: var(--ink); }
  .msg { color: var(--dim); margin: 6px 0; white-space: pre-wrap; }
  .msg.err { color: var(--err); }
  #hud { position: absolute; top: 10px; right: 10px; padding: 6px 10px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; text-align: right; pointer-events: none; min-width: 180px; }
  #hud .big { color: var(--accent); }
  #hud .portal { color: #8ad8ff; }
  #mini { position: absolute; right: 10px; bottom: 10px; border: 1px solid var(--line); border-radius: 4px; cursor: crosshair; image-rendering: pixelated; }
  #mini.hidden { display: none; }
  #err { position: absolute; inset: 0; display: none; place-items: center; padding: 24px; white-space: pre-wrap; color: var(--err); background: var(--bg); }
  #busy { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); padding: 6px 12px; background: var(--panel);
    border: 1px solid var(--accent); border-radius: 6px; display: none; }
  @media (max-width: 640px) { #panel { width: auto; right: 10px; bottom: 45%; } #hud { display: none; } }
</style>
</head>
<body>
<canvas id="gl" class="stage"></canvas>
<canvas id="overlay" class="stage"></canvas>
<canvas id="mini"></canvas>
<div id="hud"></div>
<div id="busy">generating…</div>
<div id="panel">
  <div class="head"><b>automix maps</b><button id="hide" class="link">hide</button></div>
  <div class="tabs" id="tabs">
    <button data-tab="world" class="on">world</button>
    <button data-tab="sub">sub-map</button>
    <button data-tab="lab">lab</button>
    <button data-tab="themes">themes</button>
    <button data-tab="view">view</button>
  </div>
  <div class="body" id="body"></div>
</div>
<div id="err"></div>
<script type="module" src="src/app.js"></script>
</body>
</html>
